<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" role="img" aria-label="第二部分 程序如何提交工作与检查完成" style="font-family:Noto Sans CJK SC,sans-serif;background:white"><title>第二部分 程序如何提交工作与检查完成</title><desc>由可编辑矢量图形组成的机制图。</desc><rect x="0" y="0" width="900" height="515" fill="white" /><text x="40" y="45" font-size="26" font-weight="700" text-anchor="start" fill="#172b37">第二部分 程序如何提交工作与检查完成</text><text x="40" y="89" font-size="21" font-weight="600" text-anchor="start" fill="#172b37">提交与完成是不同阶段</text><svg viewBox="0 0 820 345" role="img" aria-label="QP 提交与 CQ 完成" style="font-family:Noto Sans CJK SC,sans-serif;background:white" x="40" y="108" width="820" height="345"><title>QP 提交与 CQ 完成</title><desc>post 是提交，CQ 中的成功完成是另一阶段。完成之后能否交给消费者，还要看同步与发布协议。</desc><defs><marker id="p3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#177b75" /></marker><marker id="p3-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8793" /></marker></defs><rect x="25" y="42" width="180" height="82" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="115.0" y="79.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">程序</text><text x="115.0" y="106.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">准备缓冲和 WR</text><rect x="312" y="42" width="195" height="82" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="409.5" y="79.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">QP 的 SQ / RQ</text><text x="409.5" y="106.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">工作队列</text><rect x="614" y="42" width="180" height="82" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="704.0" y="79.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">RNIC</text><text x="704.0" y="106.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">执行操作</text><path d="M209 83 L304 83" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><text x="257" y="65" fill="#172b37" font-size="16" font-weight="500" text-anchor="middle">post</text><path d="M510 83 L606 83" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><text x="559" y="65" fill="#172b37" font-size="16" font-weight="500" text-anchor="middle">通知设备</text><rect x="312" y="213" width="195" height="82" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="409.5" y="250.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">CQ</text><text x="409.5" y="277.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">完成记录 CQE</text><path d="M704 129 L704 254" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><path d="M701 254 L515 254" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><path d="M304 254 L115 254" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><path d="M115 250 L115 131" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p3-arrow)" /><text x="207" y="236" fill="#172b37" font-size="16" font-weight="500" text-anchor="middle">程序 poll</text><text x="115" y="309" fill="#566b77" font-size="17" font-weight="500" text-anchor="start">检查状态并管理缓冲生命周期</text></svg></svg>