<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">私有内容工作台的职责与交付</title><desc id="desc">上海 VPS 保存与历史，助手分别处理私有归档、逐次批准的公开副本和私有备份；首批私有迁移与界面 v3 已完成，公开源切换仍待验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35675e" /></marker></defs><rect width="940" height="480" fill="#f4f7f7" /><rect x="30" y="150" width="240" height="100" rx="12" fill="#fff" stroke="#81a69c" /><text x="150.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172b3a">上海 VPS</text><text x="150.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c73">编辑 · 保存 · 预览 · 历史</text><rect x="320" y="150" width="270" height="100" rx="12" fill="#fff" stroke="#81a69c" /><text x="455.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172b3a">助手</text><text x="455.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c73">核对版本 · 分别授权同步与公开</text><rect x="650" y="20" width="240" height="100" rx="12" fill="#fff" stroke="#81a69c" /><text x="770.0" y="55" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172b3a">私有 notes</text><text x="770.0" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c73">全部原稿 · 历史 · 附件</text><rect x="650" y="150" width="240" height="100" rx="12" fill="#fff" stroke="#81a69c" /><text x="770.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172b3a">公开 github.io</text><text x="770.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c73">批准副本 · 目标流程待验收</text><rect x="650" y="280" width="240" height="100" rx="12" fill="#fff" stroke="#81a69c" /><text x="770.0" y="315" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172b3a">Drive 私有备份</text><text x="770.0" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c73">由助手连接 · 完整归档</text><path d="M270 200 H320" fill="none" stroke="#35675e" stroke-width="2" marker-end="url(#arrow)" /><path d="M590 175 C625 175 615 70 650 70" fill="none" stroke="#35675e" stroke-width="2" marker-end="url(#arrow)" /><path d="M590 200 H650" fill="none" stroke="#35675e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5" /><path d="M590 225 C625 225 615 330 650 330" fill="none" stroke="#35675e" stroke-width="2" marker-end="url(#arrow)" /><path d="M650 370 H135 V250" fill="none" stroke="#647782" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="330" y="390" font-family="sans-serif" font-size="13" fill="#526c73">备份恢复：核对正文、历史与素材；回收站恢复不自动发布</text><text x="35" y="425" font-family="sans-serif" font-size="16" fill="#765719">已完成：界面 v3 · 1120 文件私有迁移 · 私有备份回读/恢复</text><text x="35" y="458" font-family="sans-serif" font-size="16" fill="#765719">仍待验收：公开权威源切换与新发布流程；当前公开权威仍为既有 Drive JSON</text></svg>