<path d="M 565 638 L 595 638 L 595 582 L 620 582" fill="none" stroke="#147D83" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow147D83)"/>
<path d="M 804 560 L 841 560" fill="none" stroke="#147D83" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow147D83)"/>
<rect x="55" y="451" width="170" height="102" rx="15" fill="#FFFFFF" stroke="#D4E2E5" stroke-width="1.5"/>
<text x="140.0" y="494.35" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#183044" text-anchor="middle">
<tspan x="140.0" dy="0">L3 外存</tspan>
<tspan x="140.0" dy="27.900000000000002">无中间 Host 层</tspan>
</text>
<rect x="365" y="451" width="200" height="102" rx="15" fill="#EAF5F3" stroke="#147D83" stroke-width="1.5"/>
<text x="465.0" y="493.92499999999995" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#183044" text-anchor="middle">
<tspan x="465.0" dy="0">L1 HBM</tspan>
<tspan x="465.0" dy="29.45">KV / SWA 页</tspan>
</text>
<rect x="365" y="591" width="200" height="94" rx="15" fill="#EAF5F3" stroke="#147D83" stroke-width="1.5"/>
<text x="465.0" y="630.3499999999999" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#183044" text-anchor="middle">
<tspan x="465.0" dy="0">状态 slot</tspan>
<tspan x="465.0" dy="27.900000000000002">同边界 checkpoint</tspan>
</text>
<text x="294.5" y="478.45" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="650" fill="#147D83" text-anchor="middle">
<tspan x="294.5" dy="0">直接加载</tspan>
</text>
<rect x="620" y="491" width="184" height="138" rx="15" fill="#FFFFFF" stroke="#147D83" stroke-width="1.5"/>
<text x="712.0" y="526.4250000000001" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="650" fill="#183044" text-anchor="middle">
<tspan x="712.0" dy="0">COMMIT</tspan>
<tspan x="712.0" dy="26.35">绑定正确 COW 源</tspan>
<tspan x="712.0" dy="26.35">前向前等待</tspan>
<tspan x="712.0" dy="26.35">状态加载就绪</tspan>
</text>
<rect x="841" y="510" width="114" height="100" rx="15" fill="#FFFFFF" stroke="#D4E2E5" stroke-width="1.5"/>
<text x="898.0" y="566.3" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650" fill="#183044" text-anchor="middle">
<tspan x="898.0" dy="0">前向计算</tspan>
</text>
<text x="45" y="727.2750000000001" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#51687A" text-anchor="start">
<tspan x="45" dy="0">此 PR 的 Mamba 加载需整批完成后才 forward，未实现逐层重叠</tspan>
<tspan x="45" dy="26.35">COMMIT 设置源与状态标记，不表示此刻已完成 GPU 拷贝</tspan>
</text>
<rect x="40" y="816" width="920" height="133" rx="15" fill="#FFFFFF" stroke="#D4E2E5" stroke-width="1.5"/>
<text x="500.0" y="857.3000000000001" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="650" fill="#183044" text-anchor="middle">
<tspan x="500.0" dy="0">比较口径</tspan>
<tspan x="500.0" dy="32.550000000000004">准入时剩余等待 · HBM 预占时长 · 后端并发</tspan>
<tspan x="500.0" dy="32.550000000000004">是否更快取决于排队余量、资源预算与实测净收益</tspan>
</text>
<rect x="40" y="980" width="920" height="94" rx="15" fill="#FFF4DF" stroke="#B47D27" stroke-width="1.5"/>
<text x="500.0" y="1019.3499999999999" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#183044" text-anchor="middle">
<tspan x="500.0" dy="0">基础 #37381 已合并；hybrid #41343 仍 open（2026-09-30 核验）</tspan>
<tspan x="500.0" dy="27.900000000000002">正确性证据来自特定测试配置；尚无 TTFT / 吞吐对照</tspan>
</text>
<path d="M 44 1131 L 85 1131" fill="none" stroke="#147D83" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow147D83)"/>
<text x="98" y="1136.6" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#51687A" text-anchor="start">
<tspan x="98" dy="0">实线：必要依赖 / 主路径</tspan>
</text>
<path d="M 405 1131 L 446 1131" fill="none" stroke="#3D9FAF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow3D9FAF)"/>
<text x="460" y="1136.6" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#51687A" text-anchor="start">
<tspan x="460" dy="0">虚线：条件路径 / 待验证策略</tspan>
</text>
<text x="40" y="1176.6" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#51687A" text-anchor="start">
<tspan x="40" dy="0">概念示意，非实测时间线；箭头不表示耗时比例</tspan>
</text>
