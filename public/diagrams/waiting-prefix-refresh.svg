<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc"><title id="title">Waiting-prefix refresh：队列中的软保留</title><desc id="desc">多 P 的 cacheTPS 观测属于路由研究设想。支持 prefix sharing 时，按刷新时队列顺序对前 128 项逆序刷新 LRU，后续策略可能重排；前缀仍可被驱逐，不新增 pin，不加载 KV。常规 radix admission 的简化流程为重新匹配、临时锁定、检查资源和 chunk 预算，提交时保留 req.lock，临时锁退出，持久锁按资源生命周期释放；未接纳则临时锁退出。恢复与预取独立于 refresh：L3 预取可早于 admission，H2D load-back 受预算约束。最后跟踪排队、入场命中、恢复或计算成本和尾部 TTFT。</desc><defs><marker id="arrow-2563a8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#2563a8"/></marker><marker id="arrow-6b8192" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6b8192"/></marker><marker id="arrow-14736b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#14736b"/></marker><marker id="arrow-9d6316" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#9d6316"/></marker></defs><rect x="0" y="0" width="1280" height="1000" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="0"/><text x="40" y="49" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Waiting-prefix refresh：队列中的软保留</tspan></text><text x="40" y="81" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="40" dy="0">从路由观测到等待期刷新，再由 admission 重新判定</tspan></text><rect x="40" y="107" width="407" height="93" rx="14" fill="#ffffff" stroke="#d3dee7" stroke-width="1.5"/><text x="58" y="137" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="58" dy="0">01  多 P 的 cacheTPS 观测</tspan></text><text x="58" y="166" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="58" dy="0">已服务的 cached tokens / s</tspan></text><text x="58" y="189" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="58" dy="0">观测信号 ≠ 服务容量</tspan></text><path d="M447 153 L485 153" fill="none" stroke="#6b8192" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6b8192)"/><rect x="487" y="107" width="264" height="93" rx="14" fill="#ffffff" stroke="#d3dee7" stroke-width="1.5"/><text x="619" y="146" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle"><tspan x="619" dy="0">Router 选择 P</tspan></text><text x="619" y="178" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="619" dy="0">路由研究设想</tspan></text><path d="M751 153 L789 153" fill="none" stroke="#6b8192" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6b8192)"/><rect x="791" y="107" width="449" height="93" rx="14" fill="#ffffff" stroke="#d3dee7" stroke-width="1.5"/><text x="809" y="140" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="809" dy="0">选中 P 的 waiting queue</tspan></text><text x="809" y="174" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="809" dy="0">队头 q₁ → q₂ → … → q₁₂₈ → …</tspan></text><path d="M1015 200 L1015 227" fill="none" stroke="#2563a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563a8)"/><rect x="40" y="229" width="1200" height="205" rx="14" fill="#edf5ff" stroke="#b8d3ef" stroke-width="1.5"/><text x="60" y="264" fill="#2563a8" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="60" dy="0">02  等待阶段｜有界刷新</tspan></text><text x="798" y="263" fill="#2563a8" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="798" dy="0">适用：supports_prefix_sharing</tspan></text><rect x="60" y="283" width="332" height="108" rx="14" fill="#ffffff" stroke="#b8d3ef" stroke-width="1.5"/><text x="78" y="314" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="78" dy="0">令 k = min(N, 128)</tspan></text><text x="78" y="346" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="78" dy="0">逆序：qₖ → … → q₂ → q₁</tspan></text><text x="78" y="375" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="78" dy="0">仅扫描前 k 项；队头最后 touch</tspan></text><path d="M392 336 L427 336" fill="none" stroke="#2563a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563a8)"/><rect x="429" y="283" width="368" height="108" rx="14" fill="#ffffff" stroke="#b8d3ef" stroke-width="1.5"/><text x="447" y="314" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="447" dy="0">更新已有前缀的 LRU 次序</tspan></text><text x="447" y="346" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="447" dy="0">队头对应前缀更靠近最新端</tspan></text><text x="447" y="375" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="447" dy="0">匹配时可拆分树节点</tspan></text><path d="M797 336 L832 336" fill="none" stroke="#2563a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563a8)"/><rect x="834" y="283" width="386" height="108" rx="14" fill="#ffffff" stroke="#b8d3ef" stroke-width="1.5"/><text x="852" y="314" fill="#2563a8" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="852" dy="0">软保留：仍可被驱逐</tspan></text><text x="852" y="346" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="852" dy="0">不新增 pin / 不加载 KV</tspan></text><text x="852" y="375" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="852" dy="0">不把整个等待队列锁住</tspan></text><text x="60" y="418" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="60" dy="0">按刷新时队列顺序；后续策略可能重排 · 刷新命中不等于 admission 命中</tspan></text><path d="M652 434 L652 462" fill="none" stroke="#14736b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-14736b)"/><rect x="40" y="464" width="1200" height="288" rx="14" fill="#eef8f5" stroke="#b9dcd0" stroke-width="1.5"/><text x="60" y="499" fill="#14736b" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="60" dy="0">03  常规 radix admission（简化）</tspan></text><rect x="60" y="522" width="225" height="96" rx="14" fill="#ffffff" stroke="#b9dcd0" stroke-width="1.5"/><text x="172" y="558" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="172" dy="0">重新匹配前缀</tspan></text><text x="172" y="590" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="172" dy="0">以此刻缓存为准</tspan></text><path d="M285 570 L317 570" fill="none" stroke="#14736b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-14736b)"/><rect x="319" y="522" width="187" height="96" rx="14" fill="#ffffff" stroke="#b9dcd0" stroke-width="1.5"/><text x="412" y="558" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="412" dy="0">临时锁</tspan></text><text x="412" y="590" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="412" dy="0">保护本次判定</tspan></text><path d="M506 570 L538 570" fill="none" stroke="#14736b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-14736b)"/><rect x="540" y="522" width="293" height="96" rx="14" fill="#ffffff" stroke="#b9dcd0" stroke-width="1.5"/><text x="686" y="558" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle"><tspan x="686" dy="0">资源 / chunk 预算检查</tspan></text><text x="686" y="590" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="686" dy="0">决定本次能否接纳</tspan></text><path d="M833 556 L923 556" fill="none" stroke="#14736b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-14736b)"/><text x="865" y="542" fill="#14736b" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="865" dy="0">通过</tspan></text><rect x="925" y="522" width="295" height="96" rx="14" fill="#ffffff" stroke="#8fc4b1" stroke-width="1.5"/><text x="944" y="556" fill="#14736b" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="944" dy="0">提交：保留 req.lock</tspan></text><text x="944" y="581" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="944" dy="0">临时锁退出</tspan></text><text x="944" y="607" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="944" dy="0">持久锁按资源生命周期释放</tspan></text><path d="M833 591 L876 591 L876 683 L923 683" fill="none" stroke="#9d6316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-9d6316)"/><text x="884" y="630" fill="#9d6316" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="884" dy="0">未通过</tspan></text><rect x="925" y="648" width="295" height="83" rx="14" fill="#fff8e9" stroke="#e3c692" stroke-width="1.5"/><text x="944" y="680" fill="#9d6316" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="944" dy="0">未接纳：临时锁退出</tspan></text><text x="944" y="710" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="944" dy="0">留待后续 admission</tspan></text><rect x="60" y="647" width="773" height="84" rx="14" fill="#ffffff" stroke="#9eb8c9" stroke-width="1.5"/><text x="78" y="670" fill="#2563a8" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="78" dy="0">恢复 / 预取：独立于 refresh</tspan></text><text x="78" y="698" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="78" dy="0">L3 预取可早于 admission；H2D load-back 受预算约束</tspan></text><text x="78" y="723" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="78" dy="0">L1 GPU · L2 host · L3 外部存储</tspan></text><rect x="40" y="777" width="1200" height="172" rx="14" fill="#ffffff" stroke="#d3dee7" stroke-width="1.5"/><text x="60" y="811" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="60" dy="0">04  观测链｜验证真实收益与代价</tspan></text><rect x="60" y="828" width="198" height="67" rx="10" fill="#f5f7fa" stroke="#d3dee7" stroke-width="1.5"/><text x="159" y="855" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle"><tspan x="159" dy="0">queue wait</tspan></text><text x="159" y="882" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="159" dy="0">排队时间</tspan></text><path d="M258 861 L291 861" fill="none" stroke="#6b8192" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6b8192)"/><rect x="293" y="828" width="217" height="67" rx="10" fill="#f5f7fa" stroke="#d3dee7" stroke-width="1.5"/><text x="401" y="855" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle"><tspan x="401" dy="0">admission hit</tspan></text><text x="401" y="882" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="401" dy="0">入场时真实命中</tspan></text><path d="M510 861 L543 861" fill="none" stroke="#6b8192" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6b8192)"/><rect x="545" y="828" width="370" height="67" rx="10" fill="#f5f7fa" stroke="#d3dee7" stroke-width="1.5"/><text x="730" y="854" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="730" dy="0">restored bytes / time</tspan></text><text x="730" y="882" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="730" dy="0">或 uncached tokens / compute</tspan></text><path d="M915 861 L948 861" fill="none" stroke="#6b8192" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6b8192)"/><rect x="950" y="828" width="270" height="67" rx="10" fill="#f5f7fa" stroke="#d3dee7" stroke-width="1.5"/><text x="1085" y="868" fill="#193247" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1085" dy="0">p95 / p99 TTFT</tspan></text><text x="60" y="927" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="60" dy="0">同时检查：缓存压力 · 请求公平性 · CPU 开销</tspan></text><text x="40" y="980" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="40" dy="0">概念流程图：箭头表示机制或观测关系，不代表已测得的性能改善</tspan></text></svg>