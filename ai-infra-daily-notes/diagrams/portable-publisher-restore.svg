<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">可迁移的关键，是恢复顺序与写入权</title>
<desc id="desc">可编辑目标架构图。所有连线均表示设计路径，而非已完成能力。</desc>
<rect width="1440" height="1000" fill="#F7F9FC"/>
<defs>
<marker id="arrow2C64A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2C64A3"/></marker>
<marker id="arrowA66918" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#A66918"/></marker>
<marker id="arrow207761" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#207761"/></marker>
<marker id="arrowAD5262" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#AD5262"/></marker>
</defs>
<rect x="50" y="151" width="292" height="36" rx="18" fill="#EAF2FC"/>
<path d="M245 416 L245 472 L198 472 L198 526" fill="none" stroke="#2C64A3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow2C64A3)"/>
<path d="M735 416 L735 472 L545 472 L545 526" fill="none" stroke="#2C64A3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow2C64A3)"/>
<path d="M1210 416 L1210 472 L893 472 L893 526" fill="none" stroke="#A66918" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowA66918)" stroke-dasharray="9 7"/>
<path d="M345 625 L398 625" fill="none" stroke="#2C64A3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow2C64A3)"/>
<path d="M693 625 L746 625" fill="none" stroke="#2C64A3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow2C64A3)"/>
<path d="M1041 625 L1095 625" fill="none" stroke="#207761" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow207761)"/>
<path d="M1243 829 L1243 724" fill="none" stroke="#AD5262" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowAD5262)" stroke-dasharray="9 7"/>
<text x="48" y="75.18" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#172B45">可迁移的关键，是恢复顺序与写入权</text>
<text x="50" y="121.56" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#53677E">在干净目标环境中重建可信状态，再交接唯一写入权</text>
<text x="64" y="175.48" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#2C64A3">目标架构 · 设计路径</text>
<text x="1390" y="175.48" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#53677E">图 3 / 03</text>
<text x="50" y="981.76" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#53677E">概念设计，不表示相关能力已经实现或通过验证</text>
<text x="50" y="227.28" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2C64A3">恢复所需输入</text>
<rect x="50" y="247" width="390" height="169" rx="16" fill="#FFFFFF" stroke="#2C64A3" stroke-width="2"/>
<text x="72" y="283.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2C64A3">输入 A · 可复现代码</text>
<text x="72" y="327.22" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B45">固定版本的源码</text>
<text x="72" y="366.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">锁定提交或版本</text>
<text x="72" y="398.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">依赖与数据库模式可追溯</text>
<rect x="525" y="247" width="420" height="169" rx="16" fill="#FFFFFF" stroke="#2C64A3" stroke-width="2"/>
<text x="547" y="283.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2C64A3">输入 B · 私有数据</text>
<text x="547" y="327.22" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172B45">一致性恢复包</text>
<text x="547" y="366.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">数据库 + 素材 + 版本清单</text>
<text x="547" y="398.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">来自同一备份点，可校验</text>
<rect x="1030" y="247" width="360" height="169" rx="16" fill="#FFF4DD" stroke="#A66918" stroke-width="2"/>
<text x="1052" y="283.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#A66918">输入 C · 分离配置</text>
<text x="1052" y="326.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172B45">用户独立提供凭据</text>
<text x="1052" y="366.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">在私有目标环境配置</text>
<text x="1052" y="398.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">不进入公开内容或恢复包</text>
<rect x="50" y="526" width="295" height="198" rx="16" fill="#FFFFFF" stroke="#2C64A3" stroke-width="2"/>
<text x="72" y="562.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2C64A3">01 · 先确定兼容性</text>
<text x="72" y="604.78" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172B45">干净环境与版本检查</text>
<text x="72" y="645.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">确认源码、依赖版本</text>
<text x="72" y="677.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">核对数据模式兼容性</text>
<rect x="398" y="526" width="295" height="198" rx="16" fill="#FFFFFF" stroke="#2C64A3" stroke-width="2"/>
<text x="420" y="562.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2C64A3">02 · 先恢复，暂不写入</text>
<text x="420" y="604.06" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172B45">隔离恢复与完整性检查</text>
<text x="420" y="645.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">恢复数据库与素材</text>
<text x="420" y="677.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">核对清单、哈希与引用</text>
<rect x="746" y="526" width="295" height="198" rx="16" fill="#FFFFFF" stroke="#207761" stroke-width="2"/>
<text x="768" y="562.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#207761">03 · 在私有环境验证</text>
<text x="768" y="605.14" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172B45">回环地址冒烟测试</text>
<text x="768" y="645.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">验证读取与素材访问</text>
<text x="768" y="677.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">核对公开预览结果</text>
<rect x="1095" y="526" width="295" height="198" rx="16" fill="#FFFFFF" stroke="#207761" stroke-width="2"/>
<text x="1117" y="562.62" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#207761">04 · 最后启用写入</text>
<text x="1117" y="605.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172B45">交接唯一写入权</text>
<text x="1117" y="645.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">确认旧实例已隔离</text>
<text x="1117" y="677.2" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">再允许定时写入与发布</text>
<rect x="50" y="806" width="991" height="137" rx="18" fill="#FFFFFF" stroke="#D6E0EB" stroke-width="2"/>
<text x="76" y="854.08" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172B45">只拉取代码，不等于恢复服务</text>
<text x="76" y="904.92" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#53677E">代码、数据、素材、清单与凭据必须共同就位，并通过验证</text>
<rect x="1095" y="829" width="295" height="114" rx="16" fill="#FCEEF0" stroke="#AD5262" stroke-width="2"/>
<text x="1242.5" y="876.14" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172B45">旧实例已禁止写入</text>
<text x="1242.5" y="916.2" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#53677E">只读、停用或隔离</text>
<text x="1166.0" y="783.98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#AD5262">必要前置条件</text>
</svg>