<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" role="img" aria-label="第三部分 假想拓扑与路径约束" style="font-family:Noto Sans CJK SC,sans-serif;background:white"><title>第三部分 假想拓扑与路径约束</title><desc>由可编辑矢量图形组成的机制图。拓扑为假想示意，不是测量结果。</desc><rect x="0" y="0" width="900" height="655" fill="white" /><text x="40" y="45" font-size="26" font-weight="700" text-anchor="start" fill="#172b37">第三部分 假想拓扑与路径约束</text><text x="40" y="89" font-size="21" font-weight="600" text-anchor="start" fill="#172b37">示意假设 不代表任何实测机器</text><svg viewBox="0 0 820 485" role="img" aria-label="假想 PCIe 拓扑中的两种路径" style="font-family:Noto Sans CJK SC,sans-serif;background:white" x="40" y="108" width="820" height="485"><title>假想 PCIe 拓扑中的两种路径</title><desc>假想拓扑示意，非实测部署：假设主机上行为 Gen5 x16，设备侧为 Gen6。设备间通过 PCIe 交换结构转发；实际路径与带宽需单独验证。</desc><defs><marker id="p4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#177b75" /></marker><marker id="p4-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8793" /></marker></defs><rect x="260" y="20" width="300" height="76" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="410.0" y="54.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">主机内存与 CPU 内存系统</text><text x="410.0" y="81.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">假设的主机内存访问路径</text><path d="M410 102 L410 197" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p4-arrow)" marker-start="url(#p4-arrow)" /><text x="431" y="148" fill="#172b37" font-size="18" font-weight="500" text-anchor="start">假设 Gen5 x16 上行</text><rect x="260" y="205" width="300" height="66" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="410.0" y="245.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">PCIe 交换结构</text><path d="M326 277 L180 359" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p4-arrow)" marker-start="url(#p4-arrow)" /><path d="M494 277 L640 359" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p4-arrow)" marker-start="url(#p4-arrow)" /><text x="199" y="317" fill="#172b37" font-size="16" font-weight="500" text-anchor="middle">Gen6 分支</text><text x="620" y="317" fill="#172b37" font-size="16" font-weight="500" text-anchor="middle">Gen6 分支</text><rect x="65" y="366" width="230" height="68" rx="10" fill="#edf6f5" stroke="#cbd8dc" stroke-width="1.5" /><text x="180.0" y="396.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">RDMA 网卡</text><text x="180.0" y="423.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">连接跨机网络</text><rect x="525" y="366" width="230" height="68" rx="10" fill="#f2f0f8" stroke="#cbd8dc" stroke-width="1.5" /><text x="640.0" y="396.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">GPU HBM</text><text x="640.0" y="423.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">设备内存</text><text x="410" y="461" fill="#566b77" font-size="16" font-weight="500" text-anchor="middle">假想拓扑 · 设备间经交换结构转发 · 非实测结果</text></svg></svg>