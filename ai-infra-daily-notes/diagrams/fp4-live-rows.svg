<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker></defs><rect width="1120" height="750" fill="#f6f4ee"/><text x="44" y="48" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172638">一份 live-row 范围，贯穿整个 MoE FFN</text><text x="44" y="79" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#172638">概念示意｜固定容量不变，执行范围随当前 expert counts 改变</text><rect x="44" y="110" width="1032" height="197" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="560.0" y="214.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#172638"></text><text x="66" y="145" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#172638">A = 128    counts = [96, 0, 129, 1]</text><text x="66" y="175" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#172638">start = [0, 128, 128, 384]     end = [96, 128, 257, 385]</text><text x="66" y="206" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#172638">示例 buffer：226 行有效数据；512 行对齐容量（宽度仅作语义示意）</text><rect x="66" y="224" width="170" height="43" rx="10" fill="#b9dfd3" stroke="#cbd5e1"/><text x="151.0" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">expert 0 · 96</text><rect x="236" y="224" width="70" height="43" rx="10" fill="#e5e7eb" stroke="#cbd5e1"/><text x="271.0" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">gap</text><rect x="306" y="224" width="245" height="43" rx="10" fill="#b9dfd3" stroke="#cbd5e1"/><text x="428.5" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">expert 2 · 129</text><rect x="551" y="224" width="165" height="43" rx="10" fill="#e5e7eb" stroke="#cbd5e1"/><text x="633.5" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">gap</text><rect x="716" y="224" width="120" height="43" rx="10" fill="#b9dfd3" stroke="#cbd5e1"/><text x="776.0" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">expert 3 · 1</text><rect x="836" y="224" width="196" height="43" rx="10" fill="#e5e7eb" stroke="#cbd5e1"/><text x="934.0" y="251.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">tail padding</text><text x="66" y="291" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#172638">expert 1 为空：start = end = 128；未占用一段 live rows</text><rect x="390" y="342" width="340" height="62" rx="10" fill="#d6e5f5" stroke="#cbd5e1"/><text x="560.0" y="366.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#172638">scatter 输出 endpoint[E]</text><text x="560.0" y="391.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#172638">每个 expert 一个 int32</text><rect x="50" y="470" width="250" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="175.0" y="503.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">FC1 grouped GEMM</text><text x="175.0" y="528.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">读取 endpoint</text><rect x="435" y="470" width="250" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="503.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">SiLU + mul + FP8 quant</text><text x="560.0" y="528.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">读取同一 endpoint</text><rect x="820" y="470" width="250" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="945.0" y="503.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">FC2 grouped GEMM</text><text x="945.0" y="528.5" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#172638">读取同一 endpoint</text><line x1="300" y1="510" x2="430" y2="510" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="685" y1="510" x2="815" y2="510" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><line x1="425" y1="404" x2="175" y2="465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><line x1="560" y1="404" x2="560" y2="465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><line x1="695" y1="404" x2="945" y2="465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="64" y="594" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#172638">每个 expert 仅处理 [start, end)；start = align_up(previous_end, A)</text><text x="64" y="625" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#172638">activation padding 可保持未写，但下游不能把这些行当作有效数据</text><text x="44" y="682" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#172638">边界：新 masking 对应 SM10.x FP4 expert 的 SILU / packed-UE8M0 路径</text><text x="44" y="714" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526171">来源：vLLM #59044，head 85285b44a8 · 箭头不表示时延或带宽比例</text></svg>