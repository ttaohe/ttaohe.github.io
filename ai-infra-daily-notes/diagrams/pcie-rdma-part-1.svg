<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1315" width="900" height="1315" role="img" aria-label="第一部分 字节怎样跨过机器" style="font-family:Noto Sans CJK SC,sans-serif;background:white"><title>第一部分 字节怎样跨过机器</title><desc>由可编辑矢量图形组成的机制图。</desc><rect x="0" y="0" width="900" height="1315" fill="white" /><text x="40" y="45" font-size="26" font-weight="700" text-anchor="start" fill="#172b37">第一部分 字节怎样跨过机器</text><text x="40" y="89" font-size="21" font-weight="600" text-anchor="start" fill="#172b37">层次关系</text><svg viewBox="0 0 820 330" role="img" aria-label="应用 网络与机内互连的层次" style="font-family:Noto Sans CJK SC,sans-serif;background:white" x="40" y="108" width="820" height="330"><title>应用 网络与机内互连的层次</title><desc>PCIe 是网卡与本机部件之间的路径，不是 TCP 下面的一层网络协议。</desc><defs><marker id="p0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#177b75" /></marker><marker id="p0-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8793" /></marker></defs><rect x="40" y="20" width="740" height="60" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="410.0" y="46.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">应用语义</text><text x="410.0" y="73.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">把 A 的 KV block 交给 B</text><path d="M410 85 L410 116" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p0-arrow)" /><rect x="220" y="125" width="380" height="64" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="410.0" y="153.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">例如 RDMA WRITE</text><text x="410.0" y="180.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">网络操作</text><rect x="35" y="230" width="180" height="68" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="125.0" y="260.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A 主机内存</text><text x="125.0" y="287.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">源缓冲</text><rect x="290" y="230" width="240" height="68" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="410.0" y="260.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A 网卡 → B 网卡</text><text x="410.0" y="287.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">跨机器的网络路径</text><rect x="605" y="230" width="180" height="68" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="695.0" y="260.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">B 主机内存</text><text x="695.0" y="287.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">目标缓冲</text><path d="M215 264 L284 264" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p0-arrow)" /><text x="249" y="247" fill="#172b37" font-size="15" font-weight="500" text-anchor="middle">PCIe</text><path d="M530 264 L599 264" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p0-arrow)" /><text x="566" y="247" fill="#172b37" font-size="15" font-weight="500" text-anchor="middle">PCIe</text><path d="M410 192 L410 220" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p0-arrow)" /></svg><text x="40" y="499.0" font-size="21" font-weight="600" text-anchor="start" fill="#172b37">WRITE 由 A 推送数据</text><svg viewBox="0 0 820 320" role="img" aria-label="RDMA WRITE 的数据路径" style="font-family:Noto Sans CJK SC,sans-serif;background:white" x="40" y="518.0" width="820" height="320"><title>RDMA WRITE 的数据路径</title><desc>A 发起 WRITE，payload 从 A 内存流向 B 内存。省略队列控制、网络确认与分包细节。</desc><defs><marker id="p1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#177b75" /></marker><marker id="p1-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8793" /></marker></defs><text x="175" y="34" fill="#172b37" font-size="20" font-weight="650" text-anchor="middle">机器 A</text><text x="645" y="34" fill="#172b37" font-size="20" font-weight="650" text-anchor="middle">机器 B</text><rect x="60" y="60" width="230" height="68" rx="10" fill="#edf6f5" stroke="#cbd8dc" stroke-width="1.5" /><text x="175.0" y="90.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A 主机内存</text><text x="175.0" y="117.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">源缓冲</text><rect x="530" y="60" width="230" height="68" rx="10" fill="#edf6f5" stroke="#cbd8dc" stroke-width="1.5" /><text x="645.0" y="90.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">B 主机内存</text><text x="645.0" y="117.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">目标缓冲</text><rect x="60" y="225" width="230" height="65" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="175.0" y="264.5" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A RNIC</text><rect x="530" y="225" width="230" height="65" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="645.0" y="264.5" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">B RNIC</text><path d="M175 132 L175 218" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p1-arrow)" /><text x="68" y="176" fill="#172b37" font-size="16" font-weight="500" text-anchor="start">① PCIe 读</text><path d="M645 218 L645 132" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p1-arrow)" /><text x="664" y="176" fill="#172b37" font-size="16" font-weight="500" text-anchor="start">③ PCIe 写</text><path d="M295 257 L523 257" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p1-arrow)" /><text x="410" y="236" fill="#172b37" font-size="17" font-weight="500" text-anchor="middle">② 网络 payload</text><text x="410" y="287" fill="#566b77" font-size="15" font-weight="500" text-anchor="middle">网络交换机与线缆</text></svg><text x="40" y="899.0" font-size="21" font-weight="600" text-anchor="start" fill="#172b37">READ 由 A 请求并拉回数据</text><svg viewBox="0 0 820 335" role="img" aria-label="RDMA READ 的请求与数据方向" style="font-family:Noto Sans CJK SC,sans-serif;background:white" x="40" y="918.0" width="820" height="335"><title>RDMA READ 的请求与数据方向</title><desc>A 发起 READ。小请求 A → B，大块数据 B → A，读回后落入 A 的目标缓冲。</desc><defs><marker id="p2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#177b75" /></marker><marker id="p2-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8793" /></marker></defs><text x="175" y="34" fill="#172b37" font-size="20" font-weight="650" text-anchor="middle">发起方 A</text><text x="645" y="34" fill="#172b37" font-size="20" font-weight="650" text-anchor="middle">被读取方 B</text><rect x="60" y="70" width="230" height="68" rx="10" fill="#edf6f5" stroke="#cbd8dc" stroke-width="1.5" /><text x="175.0" y="100.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A 主机内存</text><text x="175.0" y="127.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">目标缓冲</text><rect x="530" y="70" width="230" height="68" rx="10" fill="#edf6f5" stroke="#cbd8dc" stroke-width="1.5" /><text x="645.0" y="100.0" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">B 主机内存</text><text x="645.0" y="127.0" fill="#566b77" font-size="15" font-weight="400" text-anchor="middle">源缓冲</text><rect x="60" y="225" width="230" height="65" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="175.0" y="264.5" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">A RNIC</text><rect x="530" y="225" width="230" height="65" rx="10" fill="#fff" stroke="#cbd8dc" stroke-width="1.5" /><text x="645.0" y="264.5" fill="#172b37" font-size="19" font-weight="500" text-anchor="middle">B RNIC</text><path d="M175 218 L175 145" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p2-arrow)" /><text x="68" y="182" fill="#172b37" font-size="16" font-weight="500" text-anchor="start">PCIe 写</text><path d="M645 145 L645 218" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p2-arrow)" /><text x="666" y="182" fill="#172b37" font-size="16" font-weight="500" text-anchor="start">PCIe 读</text><path d="M300 230 L519 230" fill="none" stroke="#7a8793" stroke-width="2.8" marker-end="url(#p2-gray)" stroke-dasharray="6 6" /><text x="410" y="212" fill="#566b77" font-size="16" font-weight="500" text-anchor="middle">小的 READ 请求</text><path d="M520 273 L299 273" fill="none" stroke="#177b75" stroke-width="2.8" marker-end="url(#p2-arrow)" /><text x="410" y="304" fill="#172b37" font-size="17" font-weight="500" text-anchor="middle">返回的大块 payload</text></svg></svg>