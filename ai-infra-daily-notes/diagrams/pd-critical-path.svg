<text x="633.0" y="760.5" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#183044" text-anchor="middle">
<tspan x="633.0" dy="0">KV transfer 与 DeepEP 可能共用网卡</tspan>
<tspan x="633.0" dy="31.0">已执行工作的重叠，也可能伴随带宽争用</tspan>
</text>
