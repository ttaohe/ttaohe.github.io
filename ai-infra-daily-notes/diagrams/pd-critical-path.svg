<rect x="40" y="716" width="225" height="106" rx="15" fill="#FFFFFF" stroke="#D4E2E5" stroke-width="1.5"/>
<text x="152.5" y="760.925" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#183044" text-anchor="middle">
