<tspan x="152.5" dy="29.45">GIL · 同步点</tspan>
</text>
<path d="M 265 641 L 306 641" fill="none" stroke="#147D83" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow147D83)"/>
