<tspan x="152.5" dy="29.45">设备时间线</tspan>
</text>
<path d="M 265 769 L 306 769" fill="none" stroke="#147D83" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow147D83)"/>
