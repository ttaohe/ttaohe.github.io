<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">传输提前，关键路径未必缩短</title>
<desc id="desc">概念示意，非实测时间线。实线表示典型关键依赖；虚线表示受 Decode HBM 与网络预算约束的命中前缀提前发送候选策略，并不保证当前部署或特定 connector 已实现。CPU 提交/等待与 GPU/NIC 已执行工作是两类不同测量；没有据此声称普遍吞吐或时延收益。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E6ECE9" stroke-width="0.6"/></pattern>
