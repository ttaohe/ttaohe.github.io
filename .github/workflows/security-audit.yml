name: Security Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check credential patterns without external reporting
        run: python3 scripts/audit-secrets.py
